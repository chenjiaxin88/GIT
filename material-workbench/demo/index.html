<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="素材工作台公开演示。体验按制作人领取参考图与分段提示词。">
  <title>素材工作台 · 公开演示</title>
  <style>
    @font-face {
      font-family: "Anthropic Sans";
      src: local("Anthropic Sans Web Text Regular"), local("AnthropicSansWebWeb-TextRegular"), local("Anthropic Sans Web Display Light");
      font-weight: 400;
    }
    :root {
      color-scheme: light;
      --canvas: #f5f4ed;
      --paper: #faf9f5;
      --ink: #141413;
      --muted: #5e5d59;
      --line: #e8e6dc;
      --wash: #efede4;
      --sage: #e6ece0;
      --sage-ink: #3f5742;
      --accent: #a64930;
      --accent-hover: #893b27;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 16px/1.6 "Anthropic Sans", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; color: inherit; font: inherit; }
    a { color: var(--accent); text-underline-offset: .2em; }
    :focus-visible { outline: 2px solid #316895; outline-offset: 3px; }
    h1, h2, h3, p { margin: 0; }
    .app {
      width: min(1176px, calc(100% - 64px));
      margin: 40px auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 60px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--line);
    }
    .workspace-name {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 3px 10px;
    }
    .workspace-name h1 { font-size: 17px; font-weight: 650; }
    .workspace-name span, .guide { font-size: 13px; color: var(--muted); }
    .guide { flex: none; text-decoration: none; padding-block: 6px; }
    .guide:hover { color: var(--ink); text-decoration: underline; }
    .desk { display: grid; grid-template-columns: 258px minmax(0, 1fr); min-height: 550px; }
    .queue { padding: 22px 14px; border-right: 1px solid var(--line); }
    .queue h2 { margin: 0 10px 12px; font-size: 15px; font-weight: 650; }
    .chooser {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      margin: 0 8px 18px;
      padding: 3px;
      border-radius: 8px;
      background: var(--wash);
    }
    .chooser button {
      min-height: 36px;
      padding: 4px 7px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .chooser button:hover { color: var(--ink); }
    .chooser button[aria-pressed="true"] {
      border-color: var(--line);
      color: var(--ink);
      background: var(--paper);
      font-weight: 600;
    }
    .item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 6px;
      padding: 11px 10px;
      text-align: left;
      background: transparent;
    }
    .item:hover { background: var(--wash); }
    .item[aria-pressed="true"] { background: var(--sage); box-shadow: inset 2px 0 #71876b; }
    .item small { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .item strong { font-size: 14px; font-weight: 600; }
    .detail { min-width: 0; padding: clamp(22px, 4vw, 48px); }
    .detail h2 {
      font-size: clamp(23px, 3.2vw, 35px);
      line-height: 1.3;
      letter-spacing: -.025em;
      font-weight: 650;
    }
    #task-meta { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .materials {
      display: grid;
      grid-template-columns: minmax(0, 252px) minmax(0, 1fr);
      align-items: start;
      gap: clamp(18px, 3.5vw, 40px);
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    figure { margin: 0; }
    figure svg { display: block; width: 100%; height: auto; border-radius: 8px; }
    #download { display: inline-block; margin-top: 4px; padding: 4px 0; font-size: 13px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
    .toolbar h3 { font-size: 15px; font-weight: 650; }
    #copy {
      padding: 6px 12px;
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    #copy:hover { background: var(--accent-hover); }
    #prompt { margin: 10px 0 0; font: inherit; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
    #feedback { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 999px; background: var(--sage); color: var(--sage-ink); font-size: 13px; }
    #feedback:empty { display: none; }

    @media (prefers-reduced-motion: no-preference) {
      button, .item { transition: background-color .15s ease; }
      #copy:active, .chooser button:active { transform: translateY(1px); }
      #art-subject { transition: transform .2s ease; }
      figure:hover #art-subject { transform: translateY(-2px); }
    }

    @media (max-width: 920px) {
      .app { width: calc(100% - 40px); margin-block: 20px; }
      .desk { grid-template-columns: 224px minmax(0, 1fr); }
      .materials { grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); }
    }
    @media (max-width: 700px) {
      .app { width: 100%; min-height: 100vh; margin: 0; border: 0; border-radius: 0; }
      .masthead { min-height: 54px; padding-inline: 16px; }
      .desk { display: block; }
      .queue { padding: 14px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
      .queue h2 { margin-left: 0; }
      .chooser { width: min(100%, 230px); margin: 0 0 7px; }
      .chooser button { min-height: 40px; }
      .item { padding-inline: 8px; }
      .detail { padding: 22px 16px; }
    }
    @media (max-width: 440px) {
      .materials { grid-template-columns: minmax(0, 1fr); }
      figure { width: min(100%, 240px); }
      #copy { min-height: 42px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="workspace-name"><h1>素材工作台</h1><span>公开演示</span></div>
      <a class="guide" href="https://github.com/chenjiaxin88/GIT/tree/main/material-workbench">部署说明</a>
    </header>
    <main class="desk">
      <nav class="queue" aria-labelledby="queue-title">
        <h2 id="queue-title">我的任务</h2>
        <div class="chooser" role="group" aria-label="切换示例制作人">
          <button type="button" data-person="0" aria-controls="items" aria-pressed="true">示例制作人 A</button>
          <button type="button" data-person="1" aria-controls="items" aria-pressed="false">示例制作人 B</button>
        </div>
        <div id="items"></div>
        <noscript><p>启用 JavaScript 后可切换示例任务。</p></noscript>
      </nav>
      <article class="detail" id="task-detail" aria-labelledby="task-title">
        <h2 id="task-title"></h2>
        <p id="task-meta"></p>
        <div class="materials">
          <figure>
            <svg id="reference" viewBox="0 0 300 240" role="img" aria-label="虚构参考图线稿" xmlns="http://www.w3.org/2000/svg">
              <rect id="art-bg" width="300" height="240" fill="#f2e3ca"/>
              <circle id="art-circle" cx="191" cy="96" r="65" fill="#e8c99d"/>
              <path d="M27 186h246M27 197h246" stroke="#252722" stroke-opacity=".27" fill="none"/>
              <g id="art-subject" fill="none" stroke="#252722" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></g>
            </svg>
            <figcaption><a id="download" download>下载示意图</a></figcaption>
          </figure>
          <section aria-labelledby="prompt-title">
            <div class="toolbar">
              <h3 id="prompt-title">视频提示词</h3>
              <button id="copy" type="button">复制提示词</button>
            </div>
            <pre id="prompt"></pre>
            <span id="feedback" role="status"></span>
          </section>
        </div>
      </article>
    </main>
  </div>
  <script>
    const examples = [
      [
        {id:'A-01',title:'柠檬茶 · 从落冰到注茶',timing:'6 秒 · 9:16',palette:['#f2e3ca','#e8c99d'],shape:'M100 76h100l-10 102h-80z M104 100h92 M121 131l17-6 7 18-19 5z M152 139l14-8 9 15-17 9z M165 78l18-36h22',prompt:'6 秒竖屏，固定近景，透明玻璃杯置于浅木桌。0–2 秒，两块冰依次掉进空杯，保留真实碰撞声。2–5 秒，从右上向杯中注入淡琥珀色茶汤，液面自然上升到七分满。5–6 秒，倒茶动作结束，停在杯壁细小水珠，背景保持虚化。'},
        {id:'A-02',title:'醒来咖啡 · 杯口拉花',timing:'5 秒 · 9:16',palette:['#eee0d2','#dcbda7'],shape:'M90 103c0-16 109-16 109 0s-109 16-109 0z M90 103c4 49 19 67 54 67s52-18 55-67 M199 112c56-14 43 32-4 28 M124 106c9-16 16-6 20-4 5-2 11-12 19 4l-19 9z',prompt:'5 秒竖屏，俯拍杯口。前 2 秒，手持奶缸从画面上沿进入，细流落在中央。2–4 秒，拉出轮廓自然的单层心形，液面有细微波纹。最后 1 秒奶缸退出画面，光线和焦点保持在杯缘。'}
      ],
      [
        {id:'B-01',title:'棉布袋 · 展示容量',timing:'6 秒 · 9:16',palette:['#e4e9de','#c7d5bf'],shape:'M99 95h102l9 83H90z M121 96V71a29 29 0 0 1 58 0v25 M122 137h55 M122 148h43',prompt:'6 秒竖屏，桌面略俯拍。0–2 秒，双手展开奶油白棉布袋，把袋口向镜头敞开。2–5 秒，把一本薄书和一个小纸盒逐件放入，布面随重量自然垂下。最后 1 秒提起袋子，停在提手和袋身的完整轮廓。'},
        {id:'B-02',title:'活页本 · 翻到空白页',timing:'5 秒 · 9:16',palette:['#e7e5ed','#cbc6dd'],shape:'M89 64h135v108H89z M102 64v108 M81 82h16 M81 108h16 M81 134h16 M140 89h58 M140 106h58 M140 123h58 M140 140h34',prompt:'5 秒竖屏，机位在桌面正上方。前 2 秒，左手扶住活页本的装订边，右手翻开封面。中间 2 秒，翻过一张内页，保持纸张自然弯曲和轻微摩擦声。最后 1 秒，手退出画面，停在未落笔的空白页。'}
      ]
    ];
    const personButtons = [...document.querySelectorAll('[data-person]')];
    const items = document.getElementById('items');
    const prompt = document.getElementById('prompt');
    const feedback = document.getElementById('feedback');
    const reference = document.getElementById('reference');
    const download = document.getElementById('download');
    let person = 0;
    function showTask(index) {
      const task = examples[person][index];
      [...items.children].forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
      document.getElementById('task-title').textContent = task.title;
      document.getElementById('task-meta').textContent = task.id + ' · ' + task.timing;
      document.getElementById('art-bg').setAttribute('fill', task.palette[0]);
      document.getElementById('art-circle').setAttribute('fill', task.palette[1]);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', task.shape);
      document.getElementById('art-subject').replaceChildren(path);
      download.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(reference));
      download.download = '示意图-' + task.id + '.svg';
      prompt.textContent = task.prompt;
      feedback.textContent = '';
    }
    function showPerson(index) {
      person = index;
      personButtons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
      items.replaceChildren(...examples[index].map((task, taskIndex) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'item';
        button.setAttribute('aria-controls', 'task-detail');
        const id = document.createElement('small');
        const title = document.createElement('strong');
        id.textContent = task.id;
        title.textContent = task.title;
        button.append(id,title);
        button.addEventListener('click', () => showTask(taskIndex));
        return button;
      }));
      showTask(0);
    }
    personButtons.forEach((button, index) => button.addEventListener('click', () => showPerson(index)));
    document.getElementById('copy').addEventListener('click', async () => {
      const text = prompt.textContent;
      try {
        await navigator.clipboard.writeText(text);
        if (prompt.textContent === text) feedback.textContent = '已复制完整提示词';
      } catch {
        if (prompt.textContent !== text) return;
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(prompt);
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = '已选中提示词，可用系统复制命令';
      }
    });
    showPerson(0);
  </script>
</body>
</html>
